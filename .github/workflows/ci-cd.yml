name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:

  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: |
          cd api
          npm install --legacy-peer-deps

      - name: Run tests
        run: |
          cd api
          npm test

  build:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build API Docker image
        run: docker build -t kitchen-api:ci ./api

  k8s-smoke:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4

      - name: Setup kind cluster
        uses: helm/kind-action@v1

      - name: Build image
        run: docker build -t kitchen-api:local ./api

      - name: Load image into kind
        run: kind load docker-image kitchen-api:local

      - name: Apply Kubernetes manifests
        run: kubectl apply -f k8s/ --recursive

      - name: Wait for API
        run: kubectl rollout status deployment/api-deployment -n kitchen-app --timeout=120s

      - name: Smoke test API
        run: kubectl port-forward svc/api 3000:3000 -n kitchen-app & sleep 5 && curl http://localhost:3000/health